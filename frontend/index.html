<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <header class="sidebar-header">
                <h1 class="logo">Atelier</h1>
                <button id="new-project-btn" class="btn-icon" title="New project">+</button>
            </header>

            <section id="project-section">
                <div id="project-selector">
                    <select id="project-select">
                        <option value="">Select project...</option>
                    </select>
                    <button id="delete-project-btn" class="btn-icon btn-danger" title="Delete current project" disabled>&times;</button>
                </div>
            </section>

            <section id="tree-section">
                <div class="section-label">
                    <span>Prompt tree</span>
                    <button id="new-root-btn" class="btn-sm" title="New root prompt" disabled>+ Root</button>
                </div>
                <div id="prompt-tree"></div>
            </section>
        </aside>

        <main id="workspace">
            <div id="empty-state" class="empty-state">
                <p class="empty-title">No prompt selected</p>
                <p class="empty-sub">Select a node from the tree, or create a new root prompt.</p>
            </div>

            <div id="editor-panel" class="panel" hidden>
                <div class="panel-header">
                    <h2>Prompt</h2>
                    <div class="panel-actions">
                        <button id="copy-prompt-btn" class="btn-sm" title="Copy prompt to clipboard">Copy</button>
                        <button id="delete-node-btn" class="btn-sm btn-danger" title="Delete this node and all children">Delete</button>
                        <button id="fork-btn" class="btn-sm" title="Fork from this node">Fork</button>
                        <button id="iterate-btn" class="btn-sm btn-primary" title="Create child refinement">Iterate</button>
                    </div>
                </div>
                <input id="prompt-name" type="text" placeholder="Name (optional)" maxlength="255">
                <textarea id="prompt-text" placeholder="Your Midjourney prompt..." rows="4"></textarea>
                <textarea id="prompt-notes" placeholder="Notes — what you're going for, what to change..." rows="2"></textarea>
                <div id="node-tags" class="tag-area">
                    <div id="node-tag-list" class="tag-list"></div>
                    <input id="node-tag-input" class="tag-input" type="text" placeholder="Add tag...">
                </div>
                <div class="editor-footer">
                    <label id="star-toggle" class="star-label">
                        <input type="checkbox" id="star-checkbox">
                        <span class="star-icon">&#9734;</span>
                    </label>
                    <button id="save-prompt-btn" class="btn-sm">Save</button>
                </div>
            </div>

            <div id="image-panel" class="panel" hidden>
                <div class="panel-header">
                    <h2>Result</h2>
                    <div class="panel-actions">
                        <button id="replace-image-btn" class="btn-sm" title="Upload a different file" hidden>Replace</button>
                        <button id="generate-btn" class="btn-sm btn-primary" title="Generate via Midjourney from this prompt">Generate</button>
                    </div>
                </div>
                <div id="generation-status" class="generation-status" hidden></div>
                <div id="image-dropzone" class="dropzone">
                    <img id="image-preview" hidden>
                    <p id="dropzone-label">Drop, paste, or click to upload</p>
                    <input id="image-input" type="file" accept="image/*" hidden>
                </div>
                <div id="quadrant-actions" class="quadrant-actions" hidden>
                    <div id="upscale-thumbs" class="upscale-thumbs" hidden></div>
                    <div id="upscale-actions" class="upscale-actions" hidden></div>
                </div>
                <div class="field-label-row">
                    <label class="field-label" for="image-description">
                        Auto-description <span class="field-hint">(what the coach sees for ancestor nodes)</span>
                    </label>
                    <button type="button" id="regen-description-btn" class="btn-sm" title="Generate or regenerate the description from the image">Generate</button>
                </div>
                <textarea id="image-description" placeholder="Generating description..." rows="4"></textarea>
                <label class="field-label" for="image-feedback">Your feedback</label>
                <textarea id="image-feedback" placeholder="What do you like? What needs to change?" rows="2"></textarea>
                <div class="editor-footer">
                    <button id="save-image-btn" class="btn-sm">Save</button>
                    <button id="delete-image-btn" class="btn-sm btn-danger" hidden>Remove image</button>
                </div>
            </div>
        </main>

        <aside id="coaching-sidebar">
            <div class="panel-header">
                <h2>Coach</h2>
                <button id="clear-coaching-btn" class="btn-sm" title="Clear conversation">Clear</button>
            </div>
            <div id="coaching-messages"></div>
            <div id="coaching-input-area">
                <textarea id="coaching-input" placeholder="Ask for prompt help, or describe what to change..." rows="2"></textarea>
                <button id="coaching-send-btn" class="btn-primary">Send</button>
            </div>
        </aside>
    </div>

    <!-- Dialogs -->
    <dialog id="new-project-dialog">
        <form method="dialog">
            <h3>New project</h3>
            <input id="new-project-name" type="text" placeholder="Project name" required>
            <textarea id="new-project-desc" placeholder="Description (optional)" rows="2"></textarea>
            <div class="dialog-actions">
                <button type="button" class="btn-sm" onclick="this.closest('dialog').close()">Cancel</button>
                <button type="submit" class="btn-sm btn-primary">Create</button>
            </div>
        </form>
    </dialog>

    <dialog id="confirm-delete-dialog">
        <form method="dialog">
            <h3 id="confirm-delete-title">Delete?</h3>
            <p id="confirm-delete-message" class="confirm-message"></p>
            <p class="confirm-instructions">
                Type <code id="confirm-delete-expected"></code> to confirm:
            </p>
            <input id="confirm-delete-input" type="text" autocomplete="off" spellcheck="false">
            <div class="dialog-actions">
                <button type="button" class="btn-sm" id="confirm-delete-cancel">Cancel</button>
                <button type="button" class="btn-sm btn-danger-solid" id="confirm-delete-confirm" disabled>Delete</button>
            </div>
        </form>
    </dialog>

    <dialog id="iterate-dialog">
        <form method="dialog">
            <h3 id="iterate-dialog-title">Iterate</h3>
            <input id="iterate-name" type="text" placeholder="Name (optional)" maxlength="255">
            <textarea id="iterate-prompt-text" placeholder="Refined prompt..." rows="4"></textarea>
            <textarea id="iterate-notes" placeholder="Notes on what changed..." rows="2"></textarea>
            <div id="iterate-ref-section" class="iterate-ref" hidden>
                <label class="iterate-ref-label">Use this image as</label>
                <div class="iterate-ref-options">
                    <label><input type="radio" name="iterate-ref" value="" checked> None</label>
                    <label><input type="radio" name="iterate-ref" value="--cref"> --cref (character)</label>
                    <label><input type="radio" name="iterate-ref" value="--sref"> --sref (style)</label>
                </div>
            </div>
            <div id="root-image-section" hidden>
                <div id="root-image-dropzone" class="dropzone">
                    <img id="root-image-preview" hidden>
                    <p id="root-image-label">Drop, paste, or click to attach an image (optional)</p>
                    <input id="root-image-input" type="file" accept="image/*" hidden>
                </div>
                <button type="button" id="root-image-clear" class="btn-sm" hidden>Remove image</button>
            </div>
            <div class="dialog-actions">
                <button type="button" class="btn-sm" onclick="this.closest('dialog').close()">Cancel</button>
                <button type="submit" class="btn-sm btn-primary">Create</button>
            </div>
        </form>
    </dialog>

    <div id="lightbox" class="lightbox" hidden>
        <button id="lightbox-close" class="lightbox-close" title="Close (Esc)">&times;</button>
        <img id="lightbox-img" alt="">
    </div>

    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
